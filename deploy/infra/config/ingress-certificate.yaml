# Default certificate for the Cilium ingress (referenced by name from the
# Cilium values). It is issued for the name only: the ingress needs SNI, so
# HTTPS by bare IP address is not served anyway.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: idea-ingress-tls
  namespace: kube-system
spec:
  secretName: idea-ingress-tls
  commonName: idea
  dnsNames:
    - idea.internal
  duration: 8760h
  renewBefore: 720h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    kind: ClusterIssuer
    name: idea-selfsigned
