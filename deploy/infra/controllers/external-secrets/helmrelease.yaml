# External Secrets Operator. Used here only for its generators: secrets that
# can be made up (passwords, SSH keys) are created inside the cluster and never
# pass through a person or the repo (PLAN.md 4.2).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 10m
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: 2.15.0
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  values:
    installCRDs: true
