# Cilium is first planted by Talos (rendered from .spec.values below by
# scripts/render-bootstrap.sh). This HelmRelease then takes ownership of those
# objects and keeps them reconciled.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 10m
  releaseName: cilium
  chart:
    spec:
      chart: cilium
      version: 1.20.4
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: flux-system
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  values:
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    # Talos KubePrism: the API server is reachable on localhost from every node.
    k8sServiceHost: localhost
    k8sServicePort: 7445
    # Talos mounts cgroup v2 and bpffs itself.
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    # Kata pods are VMs: the socket-level load balancer cannot act inside
    # them, so service translation must happen on the pod's veth instead.
    socketLB:
      hostNamespaceOnly: true
    # Talos does not let workloads load kernel modules (no SYS_MODULE).
    securityContext:
      capabilities:
        ciliumAgent: [CHOWN, KILL, NET_ADMIN, NET_RAW, IPC_LOCK, SYS_ADMIN, SYS_RESOURCE, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
        cleanCiliumState: [NET_ADMIN, SYS_ADMIN, SYS_RESOURCE]
    operator:
      replicas: 1
    hubble:
      enabled: true
      relay:
        enabled: true
      tls:
        auto:
          # Certificates are generated inside the cluster, so the rendered
          # bootstrap manifest carries no key material.
          method: cronJob
    # Ingress on the node's own ports 80/443 (single node, no load balancer).
    ingressController:
      enabled: true
      default: true
      loadbalancerMode: shared
      defaultSecretNamespace: kube-system
      defaultSecretName: idea-ingress-tls
      hostNetwork:
        enabled: true
        httpPort: 80
        httpsPort: 443
    envoy:
      securityContext:
        capabilities:
          # Needed to bind ports below 1024 in host network mode.
          keepCapNetBindService: true
          envoy: [NET_ADMIN, SYS_ADMIN, NET_BIND_SERVICE]
