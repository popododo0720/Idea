apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-dev
  namespace: flux-system
spec:
  dependsOn:
    - name: apps
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: idea-deploy
  path: ./apps-dev
  prune: true
  postBuild:
    # Installation settings (IDEA_HOST), written by the installer.
    substituteFrom:
      - kind: ConfigMap
        name: idea-settings
        optional: true
  wait: true
  timeout: 10m
