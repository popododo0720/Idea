# Flux manages its own controllers.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-components
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: idea-deploy
  path: ./bootstrap/flux
  prune: false
  wait: true
  timeout: 5m
