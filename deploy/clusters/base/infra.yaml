# infra-controllers: things that install CRDs and controllers.
# infra-config: objects that need those CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-controllers
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: idea-deploy
  path: ./infra/controllers
  prune: true
  wait: true
  timeout: 15m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-config
  namespace: flux-system
spec:
  dependsOn:
    - name: infra-controllers
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: idea-deploy
  path: ./infra/config
  prune: true
  postBuild:
    # Installation settings (IDEA_HOST), written by the installer. Defaults
    # in the manifests apply when the ConfigMap is missing.
    substituteFrom:
      - kind: ConfigMap
        name: idea-settings
        optional: true
  wait: true
  timeout: 5m
