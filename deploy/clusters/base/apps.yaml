apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: platform
  interval: 10m
  sourceRef:
    kind: OCIRepository
    name: idea-deploy
  path: ./apps
  prune: true
  postBuild:
    # Installation settings (IDEA_HOST), written by the installer. Defaults
    # in the manifests apply when the ConfigMap is missing.
    substituteFrom:
      - kind: ConfigMap
        name: idea-settings
        optional: true
  wait: true
  timeout: 10m
