# Temporary read-only Git server for stage 6: serves the example repository
# from the main image so a work VM has something to clone inside the cluster.
# Forgejo replaces it in stage 7.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: git-fixture
  namespace: idea-system
spec:
  replicas: 1
  selector:
    matchLabels:
      idea.dev/role: git-fixture
  template:
    metadata:
      labels:
        idea.dev/role: git-fixture
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: git
          image: 192.168.123.1:5000/idea/main:0.1.0
          command:
            - /bin/bash
            - -ec
            - |
              mkdir -p /tmp/git && cd /tmp/git
              cp -r /opt/idea/examples/hello-calc src && cd src
              git init -q -b main
              git -c user.name=idea -c user.email=idea@example.invalid add -A
              git -c user.name=idea -c user.email=idea@example.invalid commit -q -m "Initial example"
              cd .. && git clone -q --bare src hello-calc.git
              exec git daemon --reuseaddr --export-all --base-path=/tmp/git --listen=0.0.0.0 --port=9418 /tmp/git
          ports:
            - name: git
              containerPort: 9418
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: git-fixture
  namespace: idea-system
spec:
  selector:
    idea.dev/role: git-fixture
  ports:
    - name: git
      port: 9418
      targetPort: git
