apiVersion: v1
kind: ConfigMap
metadata:
  name: test-nginx-html
data:
  index.html: |
    idea test ok
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-nginx
  template:
    metadata:
      labels:
        app: test-nginx
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.31.8-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html/test
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: test-nginx-html
---
apiVersion: v1
kind: Service
metadata:
  name: test-nginx
spec:
  selector:
    app: test-nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-nginx
spec:
  ingressClassName: cilium
  # No secretName: the Cilium default certificate (idea-ingress-tls) is used.
  # A host is required here; clients must send it as SNI.
  tls:
    - hosts:
        - idea.internal
  rules:
    - http:
        paths:
          - path: /test/
            pathType: Prefix
            backend:
              service:
                name: test-nginx
                port:
                  number: 80
