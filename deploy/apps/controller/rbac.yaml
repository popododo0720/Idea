apiVersion: v1
kind: ServiceAccount
metadata:
  name: idea-controller
  namespace: idea-system
---
# In its own namespace (idea-system).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idea-controller
  namespace: idea-system
rules:
  - apiGroups: ["idea.dev"]
    resources: ["tasks", "tasks/status", "projects", "projects/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "delete"]
  # Model keys (from the dsh panel), paired devices, the API certificate.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["idea-model-keys", "idea-devices", "idea-api-tls"]
    verbs: ["get", "update"]
  # What must not be published (publish.go); put in place by the owner.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["idea-private-strings"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idea-controller
  namespace: idea-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: idea-controller
subjects:
  - kind: ServiceAccount
    name: idea-controller
    namespace: idea-system
---
# In the work namespace: test jobs, the tokens it issues, the agent dsh (its
# pod log carries the login; its certificate is copied here), and the worker
# VMs (it sets how many run, and opens a NodePort per VM).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idea-controller
  namespace: idea-work
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames: ["idea-worker"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/scale"]
    resourceNames: ["idea-worker"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["idea-worker-forgejo", "idea-runner-registration", "idea-sync", "idea-team"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["idea-model-keys", "idea-dsh-tls"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idea-controller
  namespace: idea-work
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: idea-controller
subjects:
  - kind: ServiceAccount
    name: idea-controller
    namespace: idea-system
---
# The setup code and admin configuration the machine planted at install time
# (images/talos/setup). Read-only, that one Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idea-controller-setup
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["idea-setup"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idea-controller-setup
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: idea-controller-setup
subjects:
  - kind: ServiceAccount
    name: idea-controller
    namespace: idea-system
---
# Room on the nodes: allocatable resources and what running pods request,
# to decide whether another worker VM fits. Read-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: idea-controller-capacity
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["list"]
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: idea-controller-capacity
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: idea-controller-capacity
subjects:
  - kind: ServiceAccount
    name: idea-controller
    namespace: idea-system
