apiVersion: v1
kind: ServiceAccount
metadata:
  name: idea-controller
  namespace: idea-system
---
# In its own namespace: Tasks, and the main agent job it starts per task.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idea-controller
  namespace: idea-system
rules:
  - apiGroups: ["idea.dev"]
    resources: ["tasks", "tasks/status", "projects", "projects/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # The main agent's log, shown in the dsh panel.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "delete"]
  # Model keys (from the dsh panel), paired devices, the API certificate.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["idea-model-keys", "idea-devices", "idea-api-tls"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idea-controller
  namespace: idea-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: idea-controller
subjects:
  - kind: ServiceAccount
    name: idea-controller
    namespace: idea-system
---
# In the work namespace: work VMs, test jobs, and the two tokens it issues.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idea-controller
  namespace: idea-work
rules:
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["idea-worker-forgejo", "idea-runner-registration"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["idea-model-keys"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idea-controller
  namespace: idea-work
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: idea-controller
subjects:
  - kind: ServiceAccount
    name: idea-controller
    namespace: idea-system
---
# The setup code and admin configuration the machine planted at install time
# (images/talos/setup). Read-only, that one Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: idea-controller-setup
  namespace: kube-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["idea-setup"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: idea-controller-setup
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: idea-controller-setup
subjects:
  - kind: ServiceAccount
    name: idea-controller
    namespace: idea-system
