# Shared secret that signs webhook deliveries from Forgejo to the controller.
# Generated once inside the cluster.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: idea-webhook-secret
  namespace: idea-system
spec:
  length: 48
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idea-webhook-secret
  namespace: idea-system
spec:
  refreshPolicy: CreatedOnce
  target:
    name: idea-webhook-secret
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: idea-webhook-secret
