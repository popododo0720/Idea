# Task: one issue being worked on. The status is the single source of truth
# for where the task stands; the controller keeps nothing in memory.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tasks.idea.dev
spec:
  group: idea.dev
  scope: Namespaced
  names:
    kind: Task
    plural: tasks
    singular: task
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Repo
          type: string
          jsonPath: .spec.repo
        - name: Issue
          type: integer
          jsonPath: .spec.issue
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: PR
          type: integer
          jsonPath: .status.pullRequest
        - name: Message
          type: string
          jsonPath: .status.message
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [repo, issue]
              properties:
                repo:
                  type: string
                issue:
                  type: integer
                  format: int64
                title:
                  type: string
                body:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, WorkerStarting, Working, Gate, Done, Failed]
                phaseSince:
                  type: string
                message:
                  type: string
                worker:
                  type: string
                branch:
                  type: string
                pullRequest:
                  type: integer
                  format: int64
                pullRequestURL:
                  type: string
                headSHA:
                  type: string
                # The task's session, and the worker VM it is on ("" or absent:
                # the main agent dsh, for tasks from before the worker VMs).
                session:
                  type: string
                vm:
                  type: string
                # Prompts sent to that session (first attempt + retries).
                prompts:
                  type: integer
                  format: int64
                # Session log position when the last prompt was sent.
                promptCursor:
                  type: integer
                  format: int64
                # Times the agent was asked to rebase a conflicting pull request.
                conflicts:
                  type: integer
                  format: int64
---
# Project: one repository idea works on (Forgejo organisation "idea", the
# repository has the project's name). Issues in it become Tasks.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projects.idea.dev
spec:
  group: idea.dev
  scope: Namespaced
  names:
    kind: Project
    plural: projects
    singular: project
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Ready
          type: boolean
          jsonPath: .status.ready
        - name: Message
          type: string
          jsonPath: .status.message
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            metadata:
              type: object
              properties:
                name:
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$'
            spec:
              type: object
              properties:
                description:
                  type: string
                  maxLength: 500
                seed:
                  description: Example repository to start from (a directory under examples/), used once while the repository is empty.
                  type: string
                  pattern: '^[a-z0-9]([-a-z0-9]{0,38}[a-z0-9])?$'
            status:
              type: object
              properties:
                ready:
                  type: boolean
                message:
                  type: string
