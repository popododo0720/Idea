# Forgejo administrator account. The password is generated once inside the
# cluster; the chart reads username and password from this Secret.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: idea-forgejo-admin-password
spec:
  length: 32
  digits: 6
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idea-forgejo-admin
spec:
  refreshPolicy: CreatedOnce
  target:
    name: idea-forgejo-admin
    template:
      data:
        username: idea-admin
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: idea-forgejo-admin-password
