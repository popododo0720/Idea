# Forgejo: the Git server inside the cluster. Published at
# https://idea.internal/git/ ; pods talk to it at http://forgejo-http:3000/.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  interval: 10m
  releaseName: forgejo
  chartRef:
    kind: OCIRepository
    name: forgejo-chart
  install:
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    strategy:
      type: Recreate
    persistence:
      enabled: true
      size: 5Gi
    # The namespace enforces the "restricted" Pod Security Standard.
    podSecurityContext:
      fsGroup: 1000
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
    # Published by our own Ingress through the prefix-stripping proxy
    # (subpath-proxy.yaml), not by the chart.
    ingress:
      enabled: false
    gitea:
      admin:
        existingSecret: idea-forgejo-admin
        email: idea-admin@idea.internal
        passwordMode: keepUpdated
      additionalConfigFromEnvs:
        - name: FORGEJO__database__PASSWD
          valueFrom:
            secretKeyRef:
              name: idea-forgejo-db
              key: password
      config:
        APP_NAME: idea git
        server:
          DOMAIN: idea.internal
          ROOT_URL: https://idea.internal/git/
          DISABLE_SSH: true
        database:
          DB_TYPE: postgres
          HOST: idea-postgres:5432
          NAME: forgejo
          USER: forgejo
          SSL_MODE: disable
        service:
          DISABLE_REGISTRATION: true
        actions:
          ENABLED: true
        webhook:
          # The controller's webhook endpoint is a cluster-internal address.
          ALLOWED_HOST_LIST: private
