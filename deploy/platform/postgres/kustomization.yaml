apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: idea-system
resources:
  - passwords.yaml
  - postgres.yaml
configMapGenerator:
  - name: idea-postgres-init
    files:
      - init-roles.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Shell code: Flux must not substitute its ${...}.
    kustomize.toolkit.fluxcd.io/substitute: disabled
