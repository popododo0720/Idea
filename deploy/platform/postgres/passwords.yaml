# Database passwords, generated once inside the cluster (PLAN.md 4.2).
# Each ExternalSecret produces a Secret with one key: "password".
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: idea-db-password
spec:
  length: 40
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idea-postgres
spec:
  refreshPolicy: CreatedOnce
  target:
    name: idea-postgres
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: idea-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idea-forgejo-db
spec:
  refreshPolicy: CreatedOnce
  target:
    name: idea-forgejo-db
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: idea-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: idea-controller-db
spec:
  refreshPolicy: CreatedOnce
  target:
    name: idea-controller-db
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: idea-db-password
