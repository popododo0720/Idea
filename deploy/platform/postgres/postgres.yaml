# One small PostgreSQL for Forgejo and the idea controller.
# Plain StatefulSet with the official image: single node, no HA, no backups
# (both out of scope for this stage).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: idea-postgres
spec:
  serviceName: idea-postgres
  replicas: 1
  selector:
    matchLabels:
      idea.dev/role: postgres
  template:
    metadata:
      labels:
        idea.dev/role: postgres
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: docker.io/library/postgres:18.6-alpine
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: idea-postgres
                  key: password
            - name: FORGEJO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: idea-forgejo-db
                  key: password
            - name: IDEA_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: idea-controller-db
                  key: password
          ports:
            - name: postgres
              containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: idea-postgres-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: idea-postgres
spec:
  selector:
    idea.dev/role: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
