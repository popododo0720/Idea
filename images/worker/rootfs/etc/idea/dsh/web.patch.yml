# Overlay for the machine's agent dsh (`idea-dsh`, web profile).
# Applied with --patch at every start, so an image update takes effect even
# though the profile itself lives on the persistent volume.

# Do not send session logs (which contain the code being worked on) along
# with requests to the model API. dsh turns this on by default.
- id: session-log-deepseek
  config:
    enabled: false

# Forgejo tools: issues, pull requests, comments, commit checks.
- insert:
    - id: idea-forgejo
      name: '/opt/idea/plugins/forgejo/src/index.ts'

# Subscription sign-ins (Claude, ChatGPT, ...) sent from the owner's dsh by
# the idea plugin. See plugins/machine-sync.
- insert:
    - id: idea-machine-sync
      name: '/opt/idea/plugins/machine-sync/src/index.ts'

# Agent teams across VMs: team_spawn / team_send / team_list / team_stop,
# teammates on worker VMs talking to each other directly. See plugins/team.
- insert:
    - id: idea-team
      name: '/opt/idea/plugins/team/src/index.ts'
