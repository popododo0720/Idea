[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/idea/supervisord.pid

[program:xvnc]
; The X server is reachable only from inside the pod; noVNC is the way in.
command=/usr/bin/Xvnc :1 -geometry %(ENV_IDEA_GEOMETRY)s -depth 24 -rfbport 5901 -localhost -SecurityTypes None -AlwaysShared -AcceptSetDesktopSize
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:xfce]
command=/usr/bin/dbus-launch --exit-with-session /usr/bin/startxfce4
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=/usr/bin/websockify --web /tmp/idea/web 0.0.0.0:6080 localhost:5901
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:sshd]
command=/usr/sbin/sshd -D -e -f /etc/idea/sshd_config
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
