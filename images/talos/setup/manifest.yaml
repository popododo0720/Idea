version: v1alpha1
metadata:
  name: idea-setup
  version: 0.3.0
  author: idea
  description: |
    Makes a machine booted from the idea ISO configure itself: generates the
    Talos machine configuration on the machine, applies it, and bootstraps
    etcd after the installed system comes up.
  compatibility:
    talos:
      version: ">= v1.14.0"
