<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idea · Install</title>
<link rel="stylesheet" href="../design/idea.css">
</head>
<body>
<main class="page-narrow" style="max-width:520px">
  <div class="brand" style="margin-bottom:32px"><span class="brand-mark">i</span>idea</div>

  <div class="stack">
    <div class="stack-sm">
      <h1>Choose the install disk</h1>
      <p class="muted">All data on the chosen disk is erased. If there is a second disk, it is used for work data.</p>
    </div>

    <form class="stack" method="post" action="/cgi-bin/install">
      <fieldset style="border:0;margin:0;padding:0">
        <legend class="label">Disk</legend>
        <label class="choice">
          <input type="radio" name="disk" value="/dev/sda" checked>
          <span class="choice-body">
            <span class="radio-dot"></span>
            <span class="grow">
              <span class="row"><strong class="mono">/dev/sda</strong><span class="badge badge-warn">has data</span></span>
              <span class="small muted">QEMU HARDDISK · 200 GB · SSD</span>
            </span>
          </span>
        </label>
        <label class="choice">
          <input type="radio" name="disk" value="/dev/sdb">
          <span class="choice-body">
            <span class="radio-dot"></span>
            <span class="grow">
              <span class="row"><strong class="mono">/dev/sdb</strong><span class="badge">empty</span></span>
              <span class="small muted">QEMU HARDDISK · 500 GB · HDD</span>
            </span>
          </span>
        </label>
      </fieldset>

      <div class="alert alert-bad">
        <div>All existing data on <strong>/dev/sda</strong> is erased. This cannot be undone.</div>
      </div>

      <div class="field">
        <label class="label" for="confirm">Type <code>/dev/sda</code> to confirm</label>
        <input class="input mono" id="confirm" name="confirm" autocomplete="off" spellcheck="false">
      </div>

      <button class="btn btn-primary btn-block" type="submit">Install on this disk</button>
    </form>

    <dl class="kv small">
      <dt>Machine address</dt><dd><span class="val mono">192.168.1.50</span></dd>
      <dt>Talos</dt><dd><span class="val mono">v1.14.6</span></dd>
      <dt>idea</dt><dd><span class="val mono">0.2.0</span></dd>
    </dl>
  </div>
</main>
</body>
</html>
