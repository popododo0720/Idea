<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idea · 설치</title>
<link rel="stylesheet" href="../design/idea.css">
</head>
<body>
<main class="page-narrow" style="max-width:520px">
  <div class="brand" style="margin-bottom:32px"><span class="brand-mark">i</span>idea</div>

  <div class="stack">
    <div class="stack-sm">
      <h1>설치할 디스크 선택</h1>
      <p class="muted">선택한 디스크의 모든 데이터가 지워집니다. 두 번째 디스크가 있으면 작업 데이터 저장에 씁니다.</p>
    </div>

    <form class="stack" method="post" action="/cgi-bin/install">
      <fieldset style="border:0;margin:0;padding:0">
        <legend class="label">디스크</legend>
        <label class="choice">
          <input type="radio" name="disk" value="/dev/sda" checked>
          <span class="choice-body">
            <span class="radio-dot"></span>
            <span class="grow">
              <span class="row"><strong class="mono">/dev/sda</strong><span class="badge badge-warn">데이터 있음</span></span>
              <span class="small muted">QEMU HARDDISK · 200 GB · SSD</span>
            </span>
          </span>
        </label>
        <label class="choice">
          <input type="radio" name="disk" value="/dev/sdb">
          <span class="choice-body">
            <span class="radio-dot"></span>
            <span class="grow">
              <span class="row"><strong class="mono">/dev/sdb</strong><span class="badge">비어 있음</span></span>
              <span class="small muted">QEMU HARDDISK · 500 GB · HDD</span>
            </span>
          </span>
        </label>
      </fieldset>

      <div class="alert alert-bad">
        <div><strong>/dev/sda</strong>의 기존 데이터가 모두 지워집니다. 되돌릴 수 없습니다.</div>
      </div>

      <div class="field">
        <label class="label" for="confirm">확인을 위해 <code>/dev/sda</code> 를 입력하세요</label>
        <input class="input mono" id="confirm" name="confirm" autocomplete="off" spellcheck="false">
      </div>

      <button class="btn btn-primary btn-block" type="submit">이 디스크에 설치</button>
    </form>

    <dl class="kv small">
      <dt>기기 주소</dt><dd><span class="val mono">192.168.1.50</span></dd>
      <dt>Talos</dt><dd><span class="val mono">v1.14.6</span></dd>
      <dt>idea</dt><dd><span class="val mono">0.2.0</span></dd>
    </dl>
  </div>
</main>
</body>
</html>
