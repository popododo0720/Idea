<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>idea · Setup code</title>
<link rel="stylesheet" href="../design/idea.css">
</head>
<body>
<main class="page-narrow">
  <div class="brand" style="margin-bottom:32px"><span class="brand-mark">i</span>idea</div>

  <div class="stack">
    <div class="stack-sm">
      <h1>Enter the setup code</h1>
      <p class="muted">Enter the 12-character code shown on the machine console. The code is shown again every 10 minutes.</p>
    </div>

    <form class="stack" method="post" action="/">
      <div class="field">
        <label class="label" for="code">Setup code</label>
        <input class="input code-input" id="code" name="code" placeholder="xxxx-xxxx-xxxx"
               autocomplete="one-time-code" autocapitalize="off" spellcheck="false" autofocus required>
      </div>
      <button class="btn btn-primary btn-block" type="submit">Continue</button>
    </form>

    <p class="xs subtle">Look for the <code>setup code</code> line on the console. On the Talos screen, press <kbd>/</kbd> to filter the log.</p>
  </div>
</main>
</body>
</html>
